[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysole"
version = "0.1.0"
description = "Physically-Informed Bedrock Interpolation & 3D Migration for Sparse Datasets"
readme = "README.md"
authors = [
    { name = "Daniel Binder", email = "dab@geus.dk" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["glaciology", "bedrock", "eikonal", "geophysics", "kriging", "gpr", "radar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "rasterio>=1.3.0",
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "scikit-learn>=1.2.0",
    "pykrige>=1.7.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/da0bi/pysole"
Repository = "https://github.com/da0bi/pysole"
Issues = "https://github.com/da0bi/pysole/issues"
